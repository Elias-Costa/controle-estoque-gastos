<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    O ícone (E-13, D-048 item 3): uma fichinha de papel — o cartão de fichário com a aba — sobre o
    verde do app (o `acento` de src/index.css). Fundo cheio: o iOS arredonda os cantos e o Android
    recorta pela zona segura (ferramentas/gerar-icones.ts encolhe o desenho para a versão "maskable").
    É a fonte única: favicon, ícones PNG e imagens de abertura saem daqui.
  -->
  <rect id="fundo" width="512" height="512" fill="#0b5f3a"/>
  <g id="desenho">
    <rect x="112" y="72" width="128" height="72" rx="20" fill="#ffffff"/>
    <rect x="96" y="112" width="320" height="328" rx="32" fill="#ffffff"/>
    <rect x="140" y="184" width="112" height="22" rx="11" fill="#0b5f3a" opacity="0.55"/>
    <rect x="140" y="252" width="232" height="22" rx="11" fill="#0b5f3a" opacity="0.3"/>
    <rect x="140" y="310" width="232" height="22" rx="11" fill="#0b5f3a" opacity="0.3"/>
    <rect x="140" y="368" width="160" height="22" rx="11" fill="#0b5f3a" opacity="0.3"/>
  </g>
</svg>
