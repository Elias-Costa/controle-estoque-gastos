<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover é o que faz env(safe-area-inset-*) valer quando instalado em tela cheia -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5f3a" />
    <!-- Redundante com o manifesto no iOS moderno, mantido para versões anteriores ao 16.4 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- O nome sob o ícone é a palavra dela (RI-07): hipótese até E-15 (D-048 item 2) -->
    <meta name="apple-mobile-web-app-title" content="Fichinhas" />
    <!-- O Safari quer PNG aqui; o SVG acima é só o favicon. Gerados por `bun run icones` (D-048 item 3) -->
    <link rel="apple-touch-icon" href="/icones/icone-180.png" />
    <!--
      Imagens de abertura do iPhone (D-048 item 4): o Safari só mostra a que casar com a tela, e a
      tabela de tamanhos (ferramentas/gerar-icones.ts) é de memória, não verificada. Retrato, tema claro.
    -->
    <link rel="apple-touch-startup-image" href="/abertura/640x1136.png" media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/abertura/750x1334.png" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/abertura/1242x2208.png" media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
